name: CI

on:
  push:
    branches: [ '**' ]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ARDUINO_CLI_VERSION: 1.5.0
  ARDUINO_NETWORK_CONNECTION_TIMEOUT: 240s
  ESP32_CORE_VERSION: 3.3.9
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19
  STRATA_VERSION: v0.1.2

jobs:
  metadata:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata
        run: python3 scripts/validate_release_version.py

  clang-format:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src tests examples -type f \( -name '*.h' -o -name '*.cpp' -o -name '*.ino' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  source-audit:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production sources
        run: |
          set -e
          if grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(|std::vector|std::string|std::function' src; then
            echo "Embedded safety audit failed"
            exit 1
          fi
          if grep -RInE '#include[[:space:]]+[<"](Fresh|Pulse|Signal|Tempo|Trace|Worker|Vault|Courier|Phase|Flow|Lingo)\.h[>"]' src; then
            echo "Embedded safety audit failed: Link must not depend on other ZekStack libraries"
            exit 1
          fi
          if grep -RInE 'heap_caps_|MALLOC_CAP_|esp_heap_caps|ps_malloc[[:space:]]*\(' src; then
            echo "Link allocation placement must go through Strata"
            exit 1
          fi
          if grep -RInE '(^|[^[:alnum:]_:])(malloc|calloc|realloc|free)[[:space:]]*\(|std::make_(unique|shared)[[:space:]]*<|(^|[^[:alnum:]_:])new[[:space:]]|(^|[^[:alnum:]_:])delete[[:space:]]' src; then
            echo "Link owned allocations must go through Strata"
            exit 1
          fi
          if grep -RInE 'xTaskCreate[A-Za-z]*[[:space:]]*\(|vTaskDelete[A-Za-z]*[[:space:]]*\(|xQueueCreate[A-Za-z]*[[:space:]]*\(|xSemaphoreCreate[A-Za-z]*[[:space:]]*\(' src; then
            echo "Link FreeRTOS ownership must go through Strata"
            exit 1
          fi
          if grep -RInE '#include[[:space:]]+[<"]esp_heap_caps\.h[>"]|freertos/idf_additions\.h' src; then
            echo "Link must not depend on ESP-IDF allocation internals"
            exit 1
          fi

  host-logic-tests:
    runs-on: [self-hosted, zekstack-ci]
    needs: source-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Strata
        run: git clone --depth 1 --branch "${STRATA_VERSION}" https://github.com/ZekStack/strata.git "${RUNNER_TEMP}/strata"

      - name: Build and run host logic tests
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic \
            -Itests/host/stubs \
            -Isrc \
            -I"${RUNNER_TEMP}/strata/src" \
            src/Link.cpp \
            "${RUNNER_TEMP}/strata/src/strata/Allocation.cpp" \
            "${RUNNER_TEMP}/strata/src/strata/Diagnostics.cpp" \
            "${RUNNER_TEMP}/strata/src/strata/internal/PlatformGeneric.cpp" \
            tests/host/test_link.cpp \
            -o /tmp/link-host-tests
          /tmp/link-host-tests

  persistent-host-tests:
    runs-on: [self-hosted, zekstack-ci]
    needs: source-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Strata
        run: git clone --depth 1 --branch "${STRATA_VERSION}" https://github.com/ZekStack/strata.git "${RUNNER_TEMP}/strata"

      - name: Build and run persistent-client logic tests
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic \
            -Itests/host/stubs \
            -Isrc \
            -I"${RUNNER_TEMP}/strata/src" \
            "${RUNNER_TEMP}/strata/src/strata/Allocation.cpp" \
            "${RUNNER_TEMP}/strata/src/strata/Diagnostics.cpp" \
            "${RUNNER_TEMP}/strata/src/strata/internal/PlatformGeneric.cpp" \
            tests/host/test_persistent.cpp \
            -o /tmp/link-persistent-host-tests
          /tmp/link-persistent-host-tests

  build-examples:
    runs-on: [self-hosted, zekstack-ci]
    needs: [source-audit, host-logic-tests, persistent-host-tests]
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache PIOArduino
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-

      - name: Install PIOArduino Core
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Install PIOArduino ESP32 Platform
        run: pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Fetch Strata
        run: git clone --depth 1 --branch "${STRATA_VERSION}" https://github.com/ZekStack/strata.git "${RUNNER_TEMP}/strata"

      - name: Build library examples against ArduinoJson 7.0.0
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Building $d on ${{ matrix.board }}"
              pio ci "$d" \
                --board ${{ matrix.board }} \
                --lib="." \
                --lib="${RUNNER_TEMP}/strata" \
                --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
                --project-option "lib_deps=bblanchon/ArduinoJson@7.0.0" \
                --project-option "build_unflags=-std=gnu++11" \
                --project-option "build_flags=-std=gnu++20"
            fi
          done

      - name: Compile concurrent lifecycle stress test
        if: matrix.board == 'esp32dev'
        run: |
          pio ci tests/esp32/shutdown-stress \
            --board esp32dev \
            --lib="." \
            --lib="${RUNNER_TEMP}/strata" \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "lib_deps=bblanchon/ArduinoJson@7.0.0" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

  arduino-cli:
    runs-on: [self-hosted, zekstack-ci]
    needs: [source-audit, host-logic-tests, persistent-host-tests]
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: esp32:esp32:esp32
            name: esp32dev
          - fqbn: esp32:esp32:esp32s3
            name: esp32-s3-devkitc-1
          - fqbn: esp32:esp32:esp32c3
            name: esp32-c3-devkitm-1
          - fqbn: esp32:esp32:esp32p4
            name: esp32-p4-evboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Cache Arduino CLI packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: ${{ runner.os }}-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ESP32_CORE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Install latest ArduinoJson v7
        run: arduino-cli lib install ArduinoJson

      - name: Add local libraries to sketchbook
        run: |
          set -e
          SKETCHBOOK_DIR="${HOME}/Arduino"
          mkdir -p "$SKETCHBOOK_DIR/libraries/Link"
          rsync -a --delete --exclude ".git" ./ "$SKETCHBOOK_DIR/libraries/Link/"
          rm -rf "$SKETCHBOOK_DIR/libraries/Strata"
          git clone --depth 1 --branch "${STRATA_VERSION}" \
            https://github.com/ZekStack/strata.git \
            "$SKETCHBOOK_DIR/libraries/Strata"

      - name: Build examples (${{ matrix.board.name }})
        env:
          FQBN: ${{ matrix.board.fqbn }}
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Compiling $d"
              arduino-cli compile \
                --fqbn "$FQBN" \
                --build-property "compiler.cpp.extra_flags=-std=gnu++20" \
                "$d"
            fi
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - clang-format
      - source-audit
      - host-logic-tests
      - persistent-host-tests
      - build-examples
      - arduino-cli
    runs-on: [self-hosted, zekstack-ci]
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
